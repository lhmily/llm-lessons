{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta %}
    {% set canonical_url = config.site_url ~ page.url %}
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{ config.site_name }}">
    <meta property="og:title" content="{{ page.meta.title }}">
    <meta property="og:description" content="{{ page.meta.description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ config.site_url }}assets/llm-lessons-overview.svg">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LearningResource",
        "name": {{ page.meta.title | tojson }},
        "description": {{ page.meta.description | tojson }},
        "url": {{ canonical_url | tojson }},
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "educationalLevel": "Beginner to intermediate",
        "learningResourceType": "Lesson",
        "provider": {
          "@type": "Person",
          "name": "lhmily",
          "url": "https://github.com/lhmily"
        },
        "isPartOf": {
          "@type": "Course",
          "name": "LLM Lessons",
          "url": {{ config.site_url | tojson }}
        }
      }
    </script>
  {% endif %}
{% endblock %}
