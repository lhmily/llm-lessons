[project]
name = "llm-lessons"
version = "0.1.0"
description = "Build a small language model from tensors to inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lessons"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["lessons", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_documentation_assets.py" = ["E501"]
